<style>

.aviso.a{background:linear-gradient(175deg,#6b5008,#3d2c04);color:#ffeec4}
.aviso.v{background:linear-gradient(175deg,#12512b,#083118);color:#d6ffe4}

/* ---------- la rejilla de la semana ---------- */

/* ---------- entrar ---------- */
.ent{max-width:390px;margin:8vh auto;padding:0 14px}
.ent .card{padding:22px}
.ent input{width:100%;margin-bottom:11px;font-size:19px;padding:13px;
  text-align:center;letter-spacing:.3em;font-family:var(--mono)}
.ent h1{font-size:30px}
.err{color:var(--ro1);font-size:13px;font-weight:900;margin-top:9px}
.hint{font-size:11.5px;color:var(--tx2);line-height:1.5;margin-top:8px}
#tcult tr.apag td{color:var(--tx2);opacity:.55}
#tcult tr.pren td{color:var(--tx)}
#tcult tr.pren td:first-child{border-left:4px solid var(--ver2)}

  h1{font-size:21px}
  .card{padding:11px;border-width:3px;border-radius:13px}
  .lbl{letter-spacing:.16em}

  .big{font-size:28px}
  .kv b{font-size:21px}
  th{font-size:9px;padding:7px 5px}
  td{padding:6px 5px}
  .sem td.c span{min-width:38px;font-size:11.5px;padding:3px 2px}

  .dsel{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .dsel::-webkit-scrollbar{display:none}
  .dsel>*{flex:0 0 auto}
  .gd{grid-template-columns:1fr 1fr}
}

<script>
var BUILD="v2026-11-08-PF5";
/* ====== PEGA AQUI LA LLAVE WEB DE TU FIREBASE ======
   Firebase > Configuracion del proyecto > Tus apps > Configuracion del SDK > apiKey
   Esta llave es publica a proposito: no abre nada por si sola, lo que manda son
   las reglas y la cuenta con la que cada quien entra.                        */
var API_KEY="PEGA_AQUI_TU_API_KEY";

/* ===== COMO SE ENTRA =====
   "pin"   -> solo un numero. Arranca ya, sin configurar nada. La separacion
              entre agricolas es SOLO DE PANTALLA: quien abra el codigo ve los
              cuatro PIN. Sirve para probar.
   "real"  -> correo y contrasena de verdad, con las reglas de Firebase. Ahi si
              un productor no alcanza lo de otro aunque quiera.
   Para pasar a real: cambia esta linea a "real", pega la API_KEY de arriba,
   cambia FB al proyecto nuevo, y sigue PASOS.md.                          */
var MODO=window.__MODO||"pin";

/* En modo pin va sobre la base que ya tienes. En modo real tiene que ser un
   proyecto de Firebase APARTE: en Firebase el permiso de arriba manda, y como
   la base de Parras Valley esta abierta para que jalen las demas apps, nada de
   lo que se meta ahi dentro se puede cerrar.                              */
var FB=window.__FB||"https://parrasvalley-default-rtdb.firebaseio.com";
</script>
<script type="text/babel">
var uS=React.useState,uE=React.useEffect,uM=React.useMemo,uR=React.useRef;

/* ================= utilidades ================= */
var DIAS=["vie","sab","dom","lun","mar","mie","jue"];
function p2(n){return (n<10?"0":"")+n}
function iso(d){return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())}
/* la semana va de VIERNES a JUEVES, igual que en las demas apps */
function viernes(f){
  var d=new Date((f||iso(new Date()))+"T12:00:00");
  var x=(d.getDay()-5+7)%7;            /* 5 = viernes */
  d.setDate(d.getDate()-x); return iso(d)}
function masDias(f,n){var d=new Date(f+"T12:00:00");d.setDate(d.getDate()+n);return iso(d)}
function diaDe(sem,i){return masDias(sem,i)}
function lindo(f){var d=new Date(f+"T12:00:00");
  return p2(d.getDate())+"/"+p2(d.getMonth()+1)}
function nf(v){var n=parseFloat(String(v==null?"":v).replace(/[^0-9.\-]/g,""));
  return isFinite(n)?n:0}
function miles(n){n=Math.round(n||0);
  return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,",")}
/* Firebase no admite . # $ [ ] / en el nombre de una llave */
function esc(s){return String(s==null?"":s)
  .replace(/~/g,"~t").replace(/\//g,"~s").replace(/\./g,"~p")
  .replace(/#/g,"~n").replace(/\$/g,"~d").replace(/\[/g,"~a").replace(/\]/g,"~b")}
function des(s){return String(s==null?"":s)
  .replace(/~a/g,"[").replace(/~b/g,"]").replace(/~d/g,"$").replace(/~n/g,"#")
  .replace(/~p/g,".").replace(/~s/g,"/").replace(/~t/g,"~")}
function pk(p){return esc(p.c)+"|"+esc(p.p)+"|"+(p.t||"org")}
function dePk(k){var a=String(k).split("|");
  return {c:des(a[0]||""),p:des(a[1]||""),t:a[2]||"org"}}
function nomPr(p){return p.c+" "+p.p+" "+(p.t==="cv"?"CV":"ORG")}
function sinAc(s){return String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"")
  .toLowerCase().trim()}

/* ================= sesion ================= */
/* Entrar de verdad: la cuenta la valida Google y devuelve un pase (idToken) que
   viaja en CADA lectura y escritura. Las reglas de Firebase son las que deciden
   que puede ver cada quien; la pantalla solo acompana. */
var SES={tok:null,ref:null,uid:null,mail:null,vence:0};
function post(url,cuerpo){
  return fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify(cuerpo)}).then(function(r){
      return r.json().then(function(j){
        if(!r.ok)throw new Error((j&&j.error&&j.error.message)||("HTTP "+r.status));
        return j})})}
function entra(mail,pass){
  return post("https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key="+API_KEY,
    {email:mail,password:pass,returnSecureToken:true})
  .then(function(j){
    SES.tok=j.idToken; SES.ref=j.refreshToken; SES.uid=j.localId; SES.mail=j.email;
    SES.vence=Date.now()+(nf(j.expiresIn)||3600)*1000-60000;
    try{localStorage.setItem("pf-ref",j.refreshToken)}catch(e){}
    return SES})}
function refresca(rt){
  return post("https://securetoken.googleapis.com/v1/token?key="+API_KEY,
    {grant_type:"refresh_token",refresh_token:rt})
  .then(function(j){
    SES.tok=j.id_token||j.access_token; SES.ref=j.refresh_token; SES.uid=j.user_id;
    SES.vence=Date.now()+(nf(j.expires_in)||3600)*1000-60000;
    try{localStorage.setItem("pf-ref",SES.ref)}catch(e){}
    return SES})}
function pase(){
  if(SES.tok&&Date.now()<SES.vence)return Promise.resolve(SES.tok);
  if(SES.ref)return refresca(SES.ref).then(function(){return SES.tok});
  return Promise.resolve(null)}
function sale(){SES.tok=SES.ref=SES.uid=SES.mail=null;
  try{localStorage.removeItem("pf-ref")}catch(e){}}

/* ================= Firebase con pase ================= */
function fget(ruta){
  return pase().then(function(t){
    return fetch(FB+"/"+ruta+".json"+(t?"?auth="+t:""))
      .then(function(r){ if(r.status===401||r.status===403)throw new Error("sin permiso");
        return r.json()})})}
function fput(ruta,val){
  return pase().then(function(t){
    return fetch(FB+"/"+ruta+".json"+(t?"?auth="+t:""),
      {method:"PUT",body:JSON.stringify(val)})
      .then(function(r){ if(!r.ok)throw new Error(r.status===401||r.status===403
        ? "sin permiso para guardar" : ("no se guardo: "+r.status)); return true})})}

/* ================= configuracion de arranque ================= */
/* Solo los tres nombres que Miguel ya dio. Lo demas lo captura el en CATALOGO:
   la cuarta agricola, los clientes, los productos y quien le surte a quien. */
/* cada agricola trae SU lista de cultivos: solo esos renglones ve, y solo
   esos salen en su proyeccion, sus pedidos y su balance. */
var TOM="TOMATE|25 LBS", PER="PERSA|20 LBS",
    EUR="EUROPEO|12 CT", SLI="SLICER|25 LBS";
function cfgVacia(){return {
  ag:{omcor:    {n:"Omen y Cornejo",pin:"1",
                 pr:[TOM+"|org",TOM+"|cv",SLI+"|org",PER+"|cv"]},
      biotech:  {n:"Biotech",pin:"2",
                 pr:[PER+"|org",EUR+"|org"]},
      agrokumara:{n:"Agrokumara",pin:"3",
                 pr:[TOM+"|org",TOM+"|cv",PER+"|org",PER+"|cv",
                     EUR+"|org",EUR+"|cv",SLI+"|org",SLI+"|cv"]},
      rodeli:   {n:"Rodeli",pin:"4",
                 pr:[PER+"|cv"]}},
  pr:[{c:"TOMATE", p:"25 LBS",t:"org"},
      {c:"TOMATE", p:"25 LBS",t:"cv"},
      {c:"PERSA",  p:"20 LBS",t:"org"},
      {c:"PERSA",  p:"20 LBS",t:"cv"},
      {c:"EUROPEO",p:"12 CT", t:"org"},
      {c:"EUROPEO",p:"12 CT", t:"cv"},
      {c:"SLICER", p:"25 LBS",t:"org"},
      {c:"SLICER", p:"25 LBS",t:"cv"}],
  cl:{}, au:{}, us:{}, pinMatch:"9"}}

/* los cultivos de UNA agricola. Sin lista, se entiende que trae todos. */
function prDe(cfg,ag){
  var todos=cfg.pr||[], lista=((cfg.ag||{})[ag]||{}).pr;
  if(!lista||!lista.length)return todos;
  return todos.filter(function(x){return lista.indexOf(pk(x))>=0})}
/* Si el catalogo guardado viene a medias (p.ej. solo la rama de un rancho),
   lo que falte se rellena con el de arranque. Asi nunca queda una app sin
   productos ni sin ranchos por un guardado parcial. */
function saneaCfg(c){
  c=c&&typeof c==="object"?c:{};
  var D=cfgVacia();
  var ag=(c.ag&&typeof c.ag==="object"&&Object.keys(c.ag).length)?c.ag:D.ag;
  var pr=(Array.isArray(c.pr)&&c.pr.length)?c.pr:D.pr;
  /* un rancho que se guardo sin nombre toma el del arranque */
  Object.keys(ag).forEach(function(a){
    if(!ag[a]||typeof ag[a]!=="object")ag[a]={};
    if(!ag[a].n)ag[a].n=((D.ag[a]||{}).n)||a;
    if(!ag[a].pin&&(D.ag[a]||{}).pin)ag[a].pin=D.ag[a].pin});
  /* OJO: aqui NO se agregan los ranchos del arranque que falten. Si un dia hay
     tres ranchos de verdad, meterle el cuarto de la plantilla seria inventar. */
  return {ag:ag,
          cl:c.cl&&typeof c.cl==="object"?c.cl:{},
          pr:pr,
          au:c.au&&typeof c.au==="object"?c.au:{},
          us:c.us&&typeof c.us==="object"?c.us:{},
          pinMatch:c.pinMatch||"9"}}

/* ================= EL MOTOR DEL MATCH ================= */
/* Para un producto y un dia: quien tiene bultos, quien los pide, y quien puede
   surtirle a quien. Devuelve lo cubierto, lo que falta y lo que sobra.
   El reparto atiende PRIMERO al cliente que tiene menos agricolas autorizadas
   con bultos, porque es el que se queda sin opciones si alguien mas se le
   adelanta. Entre agricolas, se jala de la que trae mas, para no dejar
   sobrantes de migaja regados.                                            */
function reparte(oferta,pedido,autoriza){
  var ag=Object.keys(oferta).filter(function(a){return nf(oferta[a])>0});
  var queda={}; ag.forEach(function(a){queda[a]=nf(oferta[a])});
  var cl=Object.keys(pedido).filter(function(c){return nf(pedido[c])>0});

  function puede(c,a){var m=autoriza[c];
    /* sin matriz capturada para ese cliente, se permite todo y se avisa aparte */
    if(!m||!Object.keys(m).length)return true;
    return !!m[a]}

  cl.sort(function(x,y){
    var nx=ag.filter(function(a){return puede(x,a)}).length;
    var ny=ag.filter(function(a){return puede(y,a)}).length;
    if(nx!==ny)return nx-ny;
    return nf(pedido[y])-nf(pedido[x])});

  var dio={},falta={},tomo={};
  cl.forEach(function(c){
    var resta=nf(pedido[c]); dio[c]={};
    var mios=ag.filter(function(a){return puede(c,a)&&queda[a]>0})
      .sort(function(a,b){return queda[b]-queda[a]});
    mios.forEach(function(a){
      if(resta<=0)return;
      var t=Math.min(resta,queda[a]);
      if(t<=0)return;
      queda[a]-=t; resta-=t; dio[c][a]=(dio[c][a]||0)+t;
      tomo[a]=(tomo[a]||0)+t});
    if(resta>0)falta[c]=resta});

  /* lo que sobra, y si ese sobrante le serviria a alguien que se quedo corto */
  var sobra={}; ag.forEach(function(a){if(queda[a]>0)sobra[a]=queda[a]});
  var trabado=[];
  Object.keys(falta).forEach(function(c){
    Object.keys(sobra).forEach(function(a){
      if(!puede(c,a))trabado.push({cl:c,ag:a,bultos:sobra[a]})})});

  var tot=function(o){return Object.keys(o).reduce(function(s,k){return s+nf(o[k])},0)};
  return {dio:dio,falta:falta,sobra:sobra,tomo:tomo,trabado:trabado,
    oferta:tot(oferta),pedido:tot(pedido),
    cubierto:tot(pedido)-tot(falta),
    totFalta:tot(falta),totSobra:tot(sobra)};
}

/* junta una semana entera: proy[ag][pk][d] y ped[cl][pk][d] */
/* junta una semana entera: proy[ag][pk][d] y ped[ag][cl][pk][d] */
function balance(cfg,proy,ped,dia){
  var ds=(dia==="todos")?[0,1,2,3,4,5,6]:[nf(dia)];
  var out=[];
  (cfg.pr||[]).forEach(function(p){
    var k=pk(p),of={},pe={};
    Object.keys(cfg.ag||{}).forEach(function(a){
      var s=0; ds.forEach(function(d){s+=nf(((proy[a]||{})[k]||{})[d])});
      if(s)of[a]=s;
      var pa=(ped[a]||{});
      Object.keys(pa).forEach(function(c){
        var q=0; ds.forEach(function(d){q+=nf((((pa[c]||{})[k])||{})[d])});
        if(q)pe[c]=(pe[c]||0)+q})});
    if(!Object.keys(of).length&&!Object.keys(pe).length)return;
    var r=reparte(of,pe,cfg.au||{});
    out.push({p:p,k:k,r:r,of:of,pe:pe})});
  return out;
}

/* LO DE UNA SOLA AGRICOLA (PF2, 08/11/2026).
   [stated] Miguel: "no quiero ver un solo collage, un solo match. Omen y
   Cornejo va a tener su proyeccion, sus pedidos, su balance y sus excedentes".
   Por eso los pedidos ahora cuelgan de la agricola: pf-ped-v1/{sem}/{ag}/{cl} */
function balanceAg(cfg,proyA,pedA,dia,ag){
  var ds=(dia==="todos")?[0,1,2,3,4,5,6]:[nf(dia)];
  var out=[];
  prDe(cfg,ag).forEach(function(p){
    var k=pk(p), of=0, pe={}, tot=0;
    ds.forEach(function(d){of+=nf(((proyA||{})[k]||{})[d])});
    Object.keys(pedA||{}).forEach(function(c){
      var s=0; ds.forEach(function(d){s+=nf((((pedA[c]||{})[k])||{})[d])});
      if(s){pe[c]=s; tot+=s}});
    if(!of&&!tot)return;
    out.push({p:p,k:k,of:of,pe:pe,ped:tot,dif:of-tot})});
  return out;
}

/* la rejilla de una agricola: que le sobra o le falta CADA DIA */
function rejillaAg(cfg,proyA,pedA,ag){
  var m={},or=[];
  prDe(cfg,ag).forEach(function(p){
    var k=pk(p),row={p:p,d:{}},hay=false;
    for(var d=0;d<7;d++){
      var of=nf(((proyA||{})[k]||{})[d]), pe=0;
      Object.keys(pedA||{}).forEach(function(c){
        pe+=nf((((pedA[c]||{})[k])||{})[d])});
      if(of||pe){row.d[d]={of:of,pe:pe,dif:of-pe};hay=true}}
    if(hay){m[k]=row;or.push(k)}});
  return {m:m,or:or};
}

/* si a una le falta, a cuales OTRAS les sobra de ese mismo producto */
function sobraOtros(cfg,proy,ped,k,yo,ds){
  var out=[];
  Object.keys(cfg.ag||{}).forEach(function(a){
    if(a===yo)return;
    var of=0,pe=0;
    ds.forEach(function(d){of+=nf((((proy[a]||{})[k])||{})[d])});
    var pa=(ped[a]||{});
    Object.keys(pa).forEach(function(c){
      ds.forEach(function(d){pe+=nf((((pa[c]||{})[k])||{})[d])})});
    if(of-pe>0)out.push({ag:a,sobra:of-pe})});
  return out;
}

/* ================= cargar pedidos desde un link ================= */
/* Llega #ped=<base64 del JSON>. Formato:
   {sem:"2026-11-06", p:[{cli:"Hudson", c:"EUROPEO", p:"12 CT", t:"org",
                          dia:0, bultos:400}, ...]}
   dia: 0 viernes ... 6 jueves. O "f":"2026-11-08" y se saca el dia solo.
   EL CLIENTE SE DA DE ALTA SOLO. El producto NO: si no esta en el catalogo se
   reporta, no se inventa, para que no se cuele un renglon mal clasificado. */
function leeLink(){
  var h=String(location.hash||"");
  var m=h.match(/[#&]ped=([^&]+)/);
  if(!m)return null;
  try{
    var txt=decodeURIComponent(escape(atob(decodeURIComponent(m[1]))));
    var o=JSON.parse(txt);
    if(!o||!Array.isArray(o.p))return null;
    return o;
  }catch(e){ try{
      var o2=JSON.parse(atob(decodeURIComponent(m[1])));
      return (o2&&Array.isArray(o2.p))?o2:null;
    }catch(e2){return null} }
}
function limpiaHash(){
  try{history.replaceState(null,"",location.pathname+location.search)}
  catch(e){location.hash=""}
}
/* casa el renglon del pedido contra el catalogo, sin importar mayusculas,
   acentos ni espacios de mas */
function casaProd(cfg,r){
  var k=function(s){return sinAc(s).replace(/\s+/g," ").trim()};
  var t=(r.t||"org").toLowerCase();
  t=(t.indexOf("cv")>=0||t.indexOf("conv")>=0)?"cv":"org";
  var hit=(cfg.pr||[]).filter(function(x){
    return k(x.c)===k(r.c)&&k(x.p)===k(r.p)&&(x.t||"org")===t})[0];
  return hit||null;
}
function idDe(n){return sinAc(n).replace(/[^a-z0-9]/g,"").slice(0,18)}

/* ================= PESTANA ESCONDIDA: CULTIVOS POR RANCHO =================
   No sale sola. Se destapa con #cultivos en la direccion o picando tres veces
   el letrerito "PerFresh". Solo la comercializadora la alcanza: al productor
   no se le dibuja ninguna de estas vistas.                                */
function Cultivos(p){
  var cfg=p.cfg, ag=p.ag, rama=p.rama, cierra=p.cierra;
  var [est,setEst]=uS("");
  var [nc,setNc]=uS(""), [np,setNp]=uS(""), [nt,setNt]=uS("org");
  var mios=prDe(cfg,ag).map(pk);
  var nom=((cfg.ag||{})[ag]||{}).n||ag;

  function pone(lista){
    setEst("guardando...");
    return rama("ag/"+ag+"/pr",lista,function(q){
      if(!q.ag[ag])q.ag[ag]={}; q.ag[ag].pr=lista})
      .then(function(){setEst("guardado")})
      .catch(function(x){setEst(String(x.message))})}

  function mueve(k,pon){
    var l=mios.filter(function(x){return x!==k});
    if(pon)l.push(k);
    pone(l)}

  function agrega(){
    var cc=nc.trim().toUpperCase().replace(/\s+/g," ");
    var pp=np.trim().toUpperCase().replace(/\s+/g," ");
    if(!cc||!pp){setEst("falta cultivo o presentacion");return}
    var nuevo={c:cc,p:pp,t:nt}, k=pk(nuevo);
    var yaEsta=(cfg.pr||[]).some(function(x){return pk(x)===k});
    var l=mios.indexOf(k)<0?mios.concat([k]):mios;
    setEst("guardando...");
    var paso=yaEsta?Promise.resolve(true)
      :rama("pr",(cfg.pr||[]).concat([nuevo]),function(q){
         q.pr=(q.pr||[]).concat([nuevo])});
    paso.then(function(){return pone(l)})
      .then(function(){setNc("");setNp("")})
      .catch(function(x){setEst(String(x.message))})}

  return <div id="cultivos">
    <div className="card">
      <div className="row" style={{justifyContent:"space-between"}}>
        <div><div className="lbl">cultivos de</div>
          <div className="big" style={{fontSize:22}}>{nom}</div></div>
        <div className="row">
          {est&&<span className={"pill "+(/guardado$/.test(est)?"ok":
            (/guardando/.test(est)?"sob":"falta"))} id="estcult">{est}</span>}
          <button className="sm gh" id="bcultcerrar"
            onClick={cierra}>esconder</button>
        </div>
      </div>
      <div className="hint">Lo que dejes prendido aqui es lo unico que
        {" "}{nom} captura, y lo unico que sale en su balance.</div>
    </div>

    <div className="card"><div className="tbl"><table id="tcult"><tbody>
      {(cfg.pr||[]).map(function(x){var k=pk(x), on=mios.indexOf(k)>=0;
        return <tr key={k} data-pr={k} className={on?"pren":"apag"}>
          <td><b>{x.c}</b></td><td>{x.p}</td>
          <td><span className={"pill "+(x.t==="cv"?"cv":"org")}>
            {x.t==="cv"?"CV":"ORG"}</span></td>
          <td style={{width:96}}>
            <button className={on?"sm":"pri sm"} data-pon={k}
              onClick={function(){mueve(k,!on)}}>
              {on?"quitar":"poner"}</button></td></tr>})}
    </tbody></table></div></div>

    <div className="card">
      <div className="lbl">cultivo que no esta en la lista</div>
      <div className="row">
        <input id="kc" placeholder="cultivo" value={nc}
          onChange={function(e){setNc(e.target.value)}}/>
        <input id="kp" placeholder="presentacion" value={np}
          onChange={function(e){setNp(e.target.value)}}/>
        <button className={nt==="org"?"on sm":"sm"} id="kto"
          onClick={function(){setNt("org")}}>ORG</button>
        <button className={nt==="cv"?"on sm":"sm"} id="ktc"
          onClick={function(){setNt("cv")}}>CV</button>
        <button className="pri sm" id="bkadd" onClick={agrega}>agregar</button>
      </div>
      <div className="hint">Se agrega a la lista y queda prendido para {nom}.
        A los demas ranchos no les aparece hasta que lo prendas ahi.</div>
    </div>
  </div>;
}

function Cargando(p){
  var datos=p.datos, cfg=p.cfg, graba=p.graba, sem=p.sem;
  var [res,setRes]=uS(null), [v,setV]=uS(false);
  function carga(){
    setV(true);
    var C=JSON.parse(JSON.stringify(cfg));
    var nuevos=[], entraron=[], fuera=[], escrituras=[];
    datos.p.forEach(function(r){
      var nom=String(r.cli||"").trim();
      if(!nom){fuera.push({r:r,por:"sin cliente"});return}
      var id=idDe(nom);
      if(!C.cl[id]){C.cl[id]={n:nom}; nuevos.push(nom)}
      var pr=casaProd(C,r);
      if(!pr){fuera.push({r:r,por:"no esta en el catalogo"});return}
      /* PF2: el pedido ahora cuelga de la agricola, asi que el renglon tiene
         que decir de cual es. Si no lo dice, no se adivina: se reporta. */
      var ida=null, nag=String(r.ag||"").trim();
      if(nag){ var kk=function(x){return sinAc(x).replace(/[^a-z0-9]/g,"")};
        ida=Object.keys(C.ag||{}).filter(function(a){
          return a===kk(nag)||kk((C.ag[a]||{}).n||"")===kk(nag)})[0]||null }
      if(!ida){fuera.push({r:r,por:"no dice de que agricola es"});return}
      /* y ese cultivo tiene que ser de los que esa agricola opera */
      if(prDe(C,ida).map(pk).indexOf(pk(pr))<0){
        fuera.push({r:r,por:"esa agricola no trabaja ese cultivo"});return}
      var d=r.dia;
      if(d==null&&r.f){ for(var i=0;i<7;i++) if(diaDe(datos.sem||sem,i)===r.f)d=i }
      d=nf(d);
      if(d<0||d>6){fuera.push({r:r,por:"dia fuera de la semana"});return}
      var b=nf(r.bultos);
      if(!b){fuera.push({r:r,por:"sin bultos"});return}
      escrituras.push({ruta:"pf-ped-v1/"+(datos.sem||sem)+"/"+ida+"/"+id+"/"+pk(pr)+"/"+d,
        val:b});
      entraron.push({cli:nom,ag:ida,pr:nomPr(pr),d:d,b:b});
    });
    /* primero el catalogo (para que el cliente nuevo exista), luego los renglones */
    var paso=nuevos.length?graba(C):Promise.resolve();
    paso.then(function(){
      return escrituras.reduce(function(ca,e){
        return ca.then(function(){return fput(e.ruta,e.val)})},Promise.resolve())})
    .then(function(){setV(false);setRes({ok:true,entraron:entraron,fuera:fuera,
      nuevos:nuevos})})
    .catch(function(x){setV(false);setRes({ok:false,msg:String(x.message),
      entraron:[],fuera:fuera,nuevos:nuevos})});
  }
  var porCli={};
  datos.p.forEach(function(r){var n=String(r.cli||"?").trim();
    porCli[n]=(porCli[n]||0)+nf(r.bultos)});

  if(res)return <div className="card" id="rescarga">
    {res.ok
      ? <div className="aviso v"><b>Se cargaron {res.entraron.length} renglones.</b>
          {!!res.nuevos.length&&<div>Clientes nuevos: {res.nuevos.join(" · ")}</div>}</div>
      : <div className="aviso r"><b>No se pudo:</b> {res.msg}</div>}
    {!!res.fuera.length&&<div className="aviso a" id="nocuadra">
      <b>Estos no entraron:</b>
      {res.fuera.map(function(f,i){return <div key={i}>
        {f.r.cli} — {f.r.c} {f.r.p} {f.r.t||"org"} — {miles(nf(f.r.bultos))} — {f.por}
      </div>})}</div>}
    <button className="pri" style={{marginTop:11}} id="bcerrar"
      onClick={function(){limpiaHash();p.fin()}}>LISTO</button>
  </div>;

  return <div className="card" id="cargapend">
    <div className="lbl">llego un pedido</div>
    <div className="tbl"><table><thead><tr><th>Cliente</th>
      <th className="n">Bultos</th></tr></thead>
      <tbody>{Object.keys(porCli).map(function(c){return <tr key={c}>
        <td>{c}</td><td className="n">{miles(porCli[c])}</td></tr>})}</tbody>
    </table></div>
    <div className="row" style={{marginTop:11}}>
      <button className="pri" id="bcargar" disabled={v} onClick={carga}>
        {v?"...":"CARGAR"}</button>
      <button className="gh" id="bdescartar"
        onClick={function(){limpiaHash();p.fin()}}>descartar</button>
    </div>
  </div>;
}

function App(){
  var [list,setList]=uS(false);
  var [yo,setYo]=uS(null);          /* {rol, ag} */
  var [cfg,setCfg]=uS(null);
  var [sem,setSem]=uS(viernes(iso(new Date())));
  var [tab,setTab]=uS("");
  /* la pestana escondida de cultivos: apagada salvo que se llame */
  var [secr,setSecr]=uS(function(){
    try{return /cultivos/i.test(location.hash||"")}catch(e){return false}});
  /* el destape: tres toques al letrerito. Los hooks van ARRIBA de todo
     return, si no React truena con el error 310. */
  var toques=uR(0), ultTo=uR(0);
  function toca(){
    var n=performance.now();
    if(n-ultTo.current>1200)toques.current=0;
    ultTo.current=n; toques.current++;
    if(toques.current>=3){toques.current=0; setSecr(true)}}
  /* cual agricola esta mirando la comercializadora */
  var [agSel,setAgSel]=uS("");
  var [err,setErr]=uS("");
  var [link,setLink]=uS(function(){return leeLink()});

  function pone(C,R){
    /* abre en la primera pestana, que ahora es Proyeccion */
    setCfg(C); setYo(R); setTab(R.rol==="prod"?"proy":"prv");
    if(R.rol!=="prod")setAgSel(Object.keys(C.ag||{})[0]||"");
    setList(true)}

  /* en modo PIN quien seas lo decide el numero, contra lo que diga el catalogo */
  function porPin(n,q){
    if(!cfg||!n)return null;
    if(q!=="co"){
      var a=Object.keys(cfg.ag||{}).filter(function(k){
        return String(cfg.ag[k].pin||"")===String(n)})[0];
      if(a)return {rol:"prod",ag:a}}
    if(q!=="ag"&&String(cfg.pinMatch||"")===String(n))
      return {rol:"admin",ag:""};
    return null}

  function arranca(){
    setErr("");
    fget("pf-cfg-v1").then(function(c){
      var C=c?saneaCfg(c):cfgVacia();
      cargaOk.current=true;      /* ya sabemos que hay del otro lado */
      /* si alla no hay catalogo todavia, la primera edicion lo escribe entero */
      cfgPuesto.current=!!(c&&c.pr&&c.pr.length&&c.ag&&Object.keys(c.ag).length);
      if(MODO==="pin"){setCfg(C);setList(true);return}
      /* quien soy: por UID contra las agricolas, o por la lista de usuarios */
      var mia=Object.keys(C.ag||{}).filter(function(a){
        return C.ag[a].uid&&C.ag[a].uid===SES.uid})[0];
      var u=(C.us||{})[SES.uid];
      pone(C,{rol:mia?"prod":((u&&u.rol)||"match"),ag:mia||(u&&u.ag)||""});
    }).catch(function(x){setErr(String(x.message));setList(true)})}

  uE(function(){
    if(MODO==="pin"){arranca();return}
    var rt=null; try{rt=localStorage.getItem("pf-ref")}catch(e){}
    if(!rt){setList(true);return}
    refresca(rt).then(arranca).catch(function(){sale();setList(true)})},[]);

  /* EL CANDADO DEL CATALOGO: esta es la UNICA escritura de toda la app que manda
     un objeto completo, y asi fue como se borro el historial de gastos en
     octubre (una lectura que fallo, y despues un guardado que escribio encima).
     Aqui no se guarda nada si la lectura inicial no respondio.             */
  var cargaOk=uR(false), cfgPuesto=uR(false);
  function graba(q){
    if(!cargaOk.current)
      return Promise.reject(new Error(
        "No se guardo: no se alcanzo a leer el catalogo. Recarga la pagina."));
    setCfg(q); return fput("pf-cfg-v1",q)}
  /* lo de cultivos escribe SOLO su rama, y hasta que el servidor confirma.
     Si del otro lado no habia catalogo, primero lo deja completo: si no, al
     recargar quedaria un catalogo con una sola rama y sin productos. */
  function grabaRama(ruta,val,mut){
    if(!cargaOk.current)
      return Promise.reject(new Error(
        "No se guardo: no se alcanzo a leer el catalogo. Recarga la pagina."));
    var base=cfgPuesto.current?Promise.resolve(true)
      :fput("pf-cfg-v1",cfg||cfgVacia()).then(function(){
         cfgPuesto.current=true; return true});
    return base.then(function(){return fput("pf-cfg-v1/"+ruta,val)})
      .then(function(){
      setCfg(function(prev){
        var q=JSON.parse(JSON.stringify(prev||cfgVacia())); mut(q); return q});
      return true})}

  if(!list)return <div className="wrap"><div className="card mut">Abriendo...</div></div>;
  var dentro=(MODO==="pin")?!!yo:!!SES.tok;
  if(!dentro)return <Entrar porPin={porPin}

  var esProd=yo&&yo.rol==="prod";
  var esAdmin=yo&&yo.rol==="admin";
  var nomAg=esProd?((cfg&&cfg.ag[yo.ag]||{}).n||yo.ag):"";

  return <div>

          salir</button>
      </div>
      <div className="row" style={{marginBottom:8}}>
        <button className="sm gh" onClick={function(){setSem(masDias(sem,-7))}}>&laquo;</button>
        <b id="sem">{lindo(sem)} al {lindo(masDias(sem,6))}</b>
        <button className="sm gh" onClick={function(){setSem(masDias(sem,7))}}>&raquo;</button>
        <button className="sm gh" onClick={function(){
          setSem(viernes(iso(new Date())))}}>esta semana</button>
      </div>
      {/* PF2: primero se escoge la agricola, y adentro sus tres vistas */}
      {!esProd&&<div className="tabs">
        {Object.keys(cfg&&cfg.ag||{}).map(function(a){
          return <button key={a} data-ag={a}
            className={(agSel===a)?"on":""}
            onClick={function(){setAgSel(a)}}>
            {cfg.ag[a].n}</button>})}
      </div>}
      {!esProd&&<div className="tabs" style={{marginTop:7}}>
        <button className={tab==="prv"?"on sm":"sm"} data-v="prv"
          onClick={function(){setTab("prv")}}>PROYECCI&Oacute;N</button>
        <button className={tab==="ped"?"on sm":"sm"} data-v="ped"
          onClick={function(){setTab("ped")}}>PEDIDOS</button>

        {secr&&<button className={tab==="cult"?"on sm":"sm"} data-v="cult"
          id="bcult" onClick={function(){setTab("cult")}}>CULTIVOS</button>}
      </div>}
    </div></div>

      {err&&<div className="card"><div className="aviso r" id="errgen">{err}</div></div>}
      {/* un pedido que llego por link: solo lo carga la comercializadora */}
      {!!link&&!esProd&&cfg&&<Cargando datos={link} cfg={cfg} graba={graba}
        sem={sem} fin={function(){setLink(null)}}/>}

       <Balance cfg={cfg} sem={sem} ag={agSel}/>}
    </div>
  </div>;
}

        if(!s)return null;
        return <tr key={k} data-pr={k}>
          <td>{x.c} {x.p} <span className={"pill "+(x.t==="cv"?"cv":"org")}>
            {x.t==="cv"?"CV":"ORG"}</span></td>
          {DIAS.map(function(_,d){var n=nf((v[k]||{})[d]);
            return <td key={d} className="n">{n?miles(n):"\u00b7"}</td>})}
          <td className="n"><b>{miles(s)}</b></td></tr>})}
      </tbody></table></div>
      {!tot&&<div className="hint" id="sinproy">Esta agricola todavia no captura nada
        de esta semana.</div>}
    </div>
  </div>;
}

window.__pf={reparte:reparte,balance:balance,balanceAg:balanceAg,rejillaAg:rejillaAg,sobraOtros:sobraOtros,pk:pk,dePk:dePk,viernes:viernes,
  esc:esc,des:des,SES:SES,MODO:MODO,cfgVacia:cfgVacia};
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body></html>
